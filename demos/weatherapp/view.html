<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter App — Quellcode &amp; Live-Ansicht</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:#0a0a0a;color:#f4f2ec;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1.5rem;border-bottom:1px solid rgba(244,242,236,0.12);flex-shrink:0;
  }
  header a{color:#f4f2ec;text-decoration:none;font-size:12px;opacity:0.7;transition:opacity .2s;}
  header a:hover{opacity:1;}
  header .title{font-size:13px;font-weight:700;letter-spacing:0.02em;text-align:center;}
  header .spacer{width:140px;}
  .layout{flex:1;display:flex;min-height:0;}
  .code-pane{
    width:min(46%, 560px);min-width:280px;
    display:flex;flex-direction:column;
    border-right:1px solid rgba(244,242,236,0.12);
  }
  .tabs{display:flex;gap:2px;padding:0.6rem 0.6rem 0;flex-shrink:0;}
  .tab{
    font-size:11.5px;font-family:'SF Mono',Consolas,monospace;padding:0.55rem 0.85rem;
    background:rgba(244,242,236,0.05);border:1px solid rgba(244,242,236,0.1);border-bottom:none;
    border-radius:7px 7px 0 0;cursor:pointer;opacity:0.55;color:#f4f2ec;transition:opacity .2s, background .2s;
  }
  .tab:hover{opacity:0.85;}
  .tab.active{opacity:1;background:rgba(244,242,236,0.1);}
  .code-scroll{flex:1;overflow:auto;background:rgba(244,242,236,0.04);}
  pre{margin:0;padding:1.2rem;}
  pre code.hljs{
    background:none !important;font-size:12.5px;line-height:1.65;
    font-family:'SF Mono',Consolas,'Courier New',monospace;
  }
  .preview-pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .preview-bar{
    display:flex;align-items:center;gap:7px;padding:0.65rem 1rem;
    border-bottom:1px solid rgba(244,242,236,0.12);flex-shrink:0;
  }
  .preview-bar .dot{width:9px;height:9px;border-radius:50%;}
  .preview-bar .dot.r{background:#ff5f57;}
  .preview-bar .dot.y{background:#febc2e;}
  .preview-bar .dot.g{background:#28c840;}
  .preview-bar span.label{font-size:11px;opacity:0.5;margin-left:8px;letter-spacing:0.03em;text-transform:uppercase;}
  iframe{flex:1;border:0;background:#fff;width:100%;}
  @media (max-width:760px){
    .layout{flex-direction:column;}
    .code-pane{width:100%;min-width:0;border-right:none;border-bottom:1px solid rgba(244,242,236,0.12);height:44vh;}
    header .title{font-size:12px;}
    header .spacer{width:60px;}
  }
</style>
</head>
<body>

<header>
  <a href="../../projekte.html#nurich">← Zurück zum Portfolio</a>
  <div class="title">Wetter App — Quellcode &amp; Live-Ansicht</div>
  <div class="spacer"></div>
</header>

<div class="layout">
  <div class="code-pane">
    <div class="tabs">
      <button class="tab active" type="button" data-file="App.jsx">App.jsx</button>
      <button class="tab" type="button" data-file="main.jsx">main.jsx</button>
      <button class="tab" type="button" data-file="index.html">index.html</button>
    </div>
    <div class="code-scroll"><pre><code id="code" class="language-javascript"></code></pre></div>
  </div>
  <div class="preview-pane">
    <div class="preview-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="label">Live-Ansicht</span>
    </div>
    <iframe src="dist/index.html" title="Wetter App Live"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const files = {
    'App.jsx': 'javascript',
    'main.jsx': 'javascript',
    'index.html': 'xml',
  };
  const codeEl = document.getElementById('code');
  const tabs = document.querySelectorAll('.tab');
  const cache = {};

  async function loadFile(name){
    try{
      if(!cache[name]){
        const res = await fetch(name);
        cache[name] = await res.text();
      }
      codeEl.className = 'language-' + files[name];
      codeEl.textContent = cache[name];
      if(window.hljs) hljs.highlightElement(codeEl);
    }catch(e){
      codeEl.textContent = 'Datei konnte nicht geladen werden.';
    }
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      loadFile(tab.dataset.file);
    });
  });

  loadFile('App.jsx');
</script>
</body>
</html>
