  <g transform="translate(36,610)">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#f5f5f6" stroke="#e8e8e9"/>
    <path d="M12 40l10-12 8 8 6-9 10 13z" fill="none" stroke="#9a9a9d" stroke-width="1.6"/>
    <circle cx="20" cy="16" r="4" fill="none" stroke="#9a9a9d" stroke-width="1.6"/>
