    <circle cx="22" cy="22" r="22" fill="#f5f5f6" stroke="#e8e8e9"/>
    <path d="M12 26v6a3 3 0 003 3h14a3 3 0 003-3v-6M22 10v20M16 16l6-6 6 6" stroke="#111113" stroke-width="1.8" fill="none"/>
    <rect x="58" y="0" width="292" height="44" rx="22" fill="#f5f5f6" stroke="#e8e8e9"/>
    <text x="78" y="27" font-size="12" class="muted">Frag etwas zu deinen Ausgaben...</text>
    <circle cx="386" cy="22" r="22" fill="#111113"/>
    <path d="M386 30V14M379 21l7-7 7 7" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
