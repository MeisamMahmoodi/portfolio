    <rect x="24" y="70" width="176" height="34" rx="17" fill="#111113"/>
    <text x="112" y="91" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Ja, Vertrag</text>
    <rect x="208" y="70" width="176" height="34" rx="17" fill="#ffffff" stroke="#e8e8e9"/>
    <text x="296" y="91" font-size="12" font-weight="600" text-anchor="middle">Nein</text>
  </g>

  <!-- insight card -->
  <g transform="translate(36,284)">
