    <rect x="12" y="2" width="4" height="12" rx="1"/><rect x="18" y="0" width="4" height="14" rx="1"/>
    <rect x="30" y="1" width="24" height="12" rx="3" fill="none" stroke="#111113" stroke-width="1.5"/>
    <rect x="32.5" y="3.5" width="16" height="7" rx="1.5"/>
  </g>

  <text x="36" y="106" font-size="14" font-weight="600">AI-Assistent</text>
  <text x="36" y="126" font-size="11" class="muted">Fragen zu deinen Finanzen, R&#252;ckfragen zu Vertr&#228;gen/Abos</text>

  <!-- pending review card -->
  <g transform="translate(36,152)">
    <rect x="0" y="0" width="408" height="118" rx="18" fill="#f5f5f6"/>
    <path d="M28 20l2.6 7.3L38 30l-7.4 2.4L28 40l-2.6-7.6L18 30l7.4-2.7z" fill="#111113"/>
    <text x="48" y="30" font-size="13" width="340">Die Zahlung an "Klarna" &#8211; ist das ein</text>
