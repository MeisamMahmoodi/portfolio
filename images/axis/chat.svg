    <circle cx="384" cy="24" r="12" fill="none"/>
    <path d="M379 19l10 10M389 19l-10 10" stroke="#9a9a9d" stroke-width="2"/>
  </g>

  <!-- chat bubbles -->
  <g transform="translate(0,382)">
    <rect x="150" y="0" width="294" height="46" rx="18" fill="#111113"/>
    <text x="176" y="29" font-size="13" fill="#ffffff">Wie viel gab ich f&#252;r Essen aus?</text>

    <rect x="36" y="62" width="380" height="46" rx="18" fill="#f5f5f6"/>
    <path d="M56 78l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#111113"/>
    <text x="76" y="90" font-size="13">Diesen Monat bisher 286,40&#8364; f&#252;r Essen.</text>
  </g>

  <g transform="translate(0,508)">
    <rect x="76" y="0" width="368" height="46" rx="18" fill="#111113"/>
    <text x="100" y="29" font-size="13" fill="#ffffff">Trag die Werkstattrechnung als 420&#8364; ein.</text>

    <rect x="36" y="62" width="386" height="46" rx="18" fill="#f5f5f6"/>
    <path d="M56 78l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#111113"/>
    <text x="76" y="90" font-size="13">Erledigt &#8212; unter Rechnungen &#183; Auto einsortiert.</text>
  </g>

