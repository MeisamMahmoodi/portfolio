  <!-- AI assistant teaser -->
  <rect x="36" y="846" width="408" height="72" rx="18" fill="#f5f5f6"/>
  <circle cx="76" cy="882" r="18" fill="#ffffff" stroke="#e8e8e9"/>
  <path d="M76 869l3.2 8.9L88 881l-8.8 2.9L76 893l-3.2-9.1L64 881l8.8-3.1z" fill="#111113"/>
  <text x="104" y="876" font-size="14" font-weight="600">AI-Assistent</text>
  <text x="104" y="895" font-size="11" class="muted">2 R&#252;ckfragen warten auf dich</text>
  <circle cx="404" cy="882" r="12" fill="#111113"/>
  <text x="404" y="887" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>

  <!-- bottom nav -->
  <g transform="translate(36,960)">
    <rect x="0" y="0" width="330" height="56" rx="28" fill="#ffffff" opacity="0.7" stroke="#ffffff"/>
    <rect x="6" y="8" width="88" height="40" rx="20" fill="#111113"/>
    <path d="M22 30l10-9 10 9" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M24 29v11h16V29" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="58" y="33" font-size="12" font-weight="600" fill="#ffffff">Home</text>
    <circle cx="130" cy="28" r="10" fill="none" stroke="#6b6b6f" stroke-width="2"/>
    <path d="M130 22v6l4 4" stroke="#6b6b6f" stroke-width="2" fill="none"/>
    <rect x="168" y="14" width="24" height="16" rx="4" fill="none" stroke="#6b6b6f" stroke-width="2"/>
    <g transform="translate(228,16)">
      <circle cx="12" cy="8" r="6" fill="none" stroke="#6b6b6f" stroke-width="2"/>
      <path d="M2 28c0-7 5.4-10 10-10s10 3 10 10" stroke="#6b6b6f" stroke-width="2" fill="none"/>
    </g>
    <circle cx="378" cy="28" r="28" fill="#111113"/>
    <path d="M368 22v8h8M388 34v-8h-8M370 34a10 10 0 0018 4.5M386 22a10 10 0 00-18-4.5" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
</svg>
